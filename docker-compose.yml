services:
  db:
    image: postgres:17-alpine
    container_name: georgian-dict-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: georgian
      POSTGRES_PASSWORD: georgian
      POSTGRES_DB: georgian_dict
      # The lexicon is Georgian and the definitions are English; sorting has to be
      # predictable across machines, so the collation is pinned rather than inherited.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # 5433 on the host, because 5432 is usually already taken by a system Postgres or
      # another project's container. Change both this and DATABASE_URL if you want 5432.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U georgian -d georgian_dict']
      interval: 5s
      timeout: 5s
      retries: 10

  # The Georgian tagger the story resolver asks about ambiguous spellings. Optional: with
  # ANALYSER_URL unset the server never calls it and linking works as it always has.
  #
  #   npm run analyser:up
  #
  # then put ANALYSER_URL=http://127.0.0.1:8000 in .env. `npm run db:up` names the db
  # service on its own, so it does not drag this 1.8 GB image along with it.
  analyser:
    build:
      context: .
      dockerfile: apps/analyser/Dockerfile
    container_name: georgian-dict-analyser
    restart: unless-stopped
    ports:
      # Published here, unlike in production, because the server runs on the host in
      # development and cannot reach a compose network by service name.
      - '8000:8000'
    healthcheck:
      # /health builds every language's pipeline, so passing it means the models are loaded
      # and the first real request will not pay for a cold start — in either language.
      # /languages answers the same question without touching a model, and is what the
      # server asks before it sends anything.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      # Reading ~400 MB of models off disk, once, on a cold container.
      start_period: 120s

  # The voice the story reader plays. Optional in exactly the way the analyser is: with
  # TTS_URL unset the server never calls it and no audio is offered anywhere.
  #
  #   npm run tts:up
  #
  # then put TTS_URL=http://127.0.0.1:8001 in .env.
  tts:
    build:
      context: .
      dockerfile: apps/tts/Dockerfile
    container_name: georgian-dict-tts
    restart: unless-stopped
    ports:
      # Published for the same reason the analyser's is: in development the server runs on
      # the host and cannot reach a compose network by service name.
      - '8001:8001'
    healthcheck:
      # /health loads every voice, so passing it means the first sentence a reader asks for
      # does not wait on 126 MB coming off disk. /voices answers which languages there are
      # without touching a model, and is what the server asks before it offers audio at all.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=10)",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      # Two 63 MB voices, once, on a cold container — far quicker than the analyser's models.
      start_period: 30s

volumes:
  db-data:
