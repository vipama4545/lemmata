# Shared by the /rpc and /api locations. Included rather than repeated, because the two
# blocks getting out of step is exactly the bug that would show up as sessions working on
# one prefix and not the other.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Appends this hop rather than replacing, so the client address the outer proxy recorded is
# still the first entry. Fastify runs with trustProxy in production and reads it from there.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# The snapshot is around 350 KB once compressed, and nginx's default 32 KB of buffers would
# send every one of them via a temp file on disk. A megabyte holds it in memory instead.
proxy_buffer_size       64k;
proxy_buffers        16 64k;
proxy_busy_buffers_size 128k;

# Long enough for the seed to be running against the same database, short enough that a wedged
# upstream fails rather than piles up.
proxy_connect_timeout 5s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;
