# The front door of the stack, behind whatever proxy already terminates TLS on the host.
#
# It serves the built app and forwards /rpc and /api to the server, which is the whole reason
# it exists: the outer proxy then has one upstream and no path rules to get right, and the
# browser sees a single origin. auth.ts compares BETTER_AUTH_URL against WEB_ORIGIN and only
# leaves the session cookie as a first-party SameSite=Lax one while they match, so keeping
# the split invisible from outside is worth a container.
#
# No TLS and no server_name here on purpose. Both belong to the proxy in front.

# X-Forwarded-Proto has to survive the second hop. The outer proxy sets it to https; if this
# were to overwrite it with $scheme, every request would look like plain http to Fastify and
# the IP and protocol recorded against a session would be this container's, not the client's.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Docker's embedded DNS. Needed because the proxy_pass lines below go through a variable,
# and that is deliberate: given a literal `proxy_pass http://server:4000`, nginx resolves
# the name once while parsing its configuration and never again. Two consequences, both
# unpleasant. It refuses to start at all if the server container is not up yet, and if the
# server is later recreated on a new address — which a redeploy of that one service does —
# nginx goes on sending requests to an address nothing is listening on, serving 502s until
# somebody thinks to restart it. Resolving per request costs a cached DNS lookup and makes
# both of those go away.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The snapshot is a few megabytes. Requests are small, but the study sync posts a batch
    # of review records and 1m (the default) is a tighter bound than it needs to be.
    client_max_body_size 4m;

    # Compresses what nginx serves itself. Responses proxied from the server arrive already
    # compressed by @fastify/compress and pass straight through.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # For the compose healthcheck. Never reached from outside — the proxy in front does not
    # route to it — and cheap enough not to want it in the log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------ the server
    #
    # The three prefixes it owns, and there are no others. Neither of the first two is a
    # public API: both are called by this app's own JavaScript, from this same origin.
    #
    #   /rpc/*       oRPC — the lexicon snapshot, a story, the study sync
    #   /api/auth/*  Better Auth — Discord sign-in, session, change-email, delete-account
    #   /health      a select 1 against Postgres
    #
    # Anything not matched here is the app, below.

    # $upstream rather than a literal, so the name is resolved per request — see the
    # resolver note above. With a variable, nginx stops appending the matched URI by
    # itself, which is why every proxy_pass below carries $request_uri explicitly.

    location ^~ /rpc/ {
        set $upstream http://server:4000;
        proxy_pass $upstream$request_uri;
        include /etc/nginx/snippets/upstream.conf;
    }

    # The whole prefix, not just /api/auth/, so that mounting something else under it later
    # is a server change and not a silent 404 served as index.html.
    location ^~ /api/ {
        set $upstream http://server:4000;
        proxy_pass $upstream$request_uri;
        include /etc/nginx/snippets/upstream.conf;
    }

    # Exact match: without it this falls through to the app below and answers every uptime
    # check with a cheerful 200 and a copy of index.html.
    location = /health {
        access_log off;
        set $upstream http://server:4000;
        proxy_pass $upstream$request_uri;
        include /etc/nginx/snippets/upstream.conf;
    }

    # ------------------------------------------------------------------- the app

    # Vite fingerprints everything under /assets, so those files never change meaning.
    #
    # add_header and not `expires 1y`: expires writes a Cache-Control of its own, and the two
    # together send the header twice — the second copy, the one carrying `immutable`, is the
    # one a browser is entitled to ignore.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # react-router owns the URL space, so anything that is not a real file is the app and
    # /stories/three-little-pigs survives a refresh.
    location / {
        # index.html above all must be revalidated, or a deploy stays invisible until each
        # browser decides its own copy has gone stale.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
