# Production, on one host, behind the proxy that is already there.
#
#   web          :80 in, published on 127.0.0.1   the built app, and /rpc + /api forwarded
#   server       :4000                            Fastify — Better Auth, oRPC
#   db           :5432                            Postgres
#   migrate                                       runs once before the server starts
#   seed                                          on demand: loads data/ into Postgres
#
#   cp .env.production.example .env     # on the server, then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm seed
#
# The plain docker-compose.yml is unchanged and still just the development database.

name: lemmata

# Docker's default json driver keeps every line forever, and Fastify logs a line per
# request. Three ten-megabyte files is a week or two here and cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The server image, and the one-shot jobs that are the same image with a different entry
# point. Sharing the definition is what keeps a migration from ever running against a build
# that is not the one about to serve traffic.
x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  # Both a build and an image, so one file covers both halves of the deploy: `build` here or
  # on CI tags this name, `push` sends it, and `pull` on the server fetches it instead of
  # compiling anything. TAG pins which one — see the note at the bottom of this file.
  image: ${REGISTRY:?set REGISTRY, e.g. youruser/yourrepo}:server-${TAG:-20260805}
  logging: *logging
  # Every variable is listed and substituted, rather than pulled in with `env_file: .env`.
  #
  # `:?` means compose refuses to deploy and names the variable, instead of starting a
  # container that dies for a reason you have to go and read the logs to discover.
  environment:
    NODE_ENV: production
    # 127.0.0.1 is the default in env.ts and would make the container unreachable from web —
    # inside a container, localhost is only the container.
    HOST: 0.0.0.0
    PORT: "4000"
    # Assembled here: the host and port are facts about this network, not the deployment.
    DATABASE_URL: postgres://${POSTGRES_USER:-georgian}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-georgian_dict}

    # These two must be the same origin, or auth.ts marks the session cookie
    # SameSite=None; Secure. Both are the public URL, not anything container-internal.
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL, e.g. https://lemmata.fyi}
    WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN, e.g. https://lemmata.fyi}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET, 32+ chars from openssl rand -base64 32}

    DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
    DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}

    # The tagger, by service name on this network. The only optional variable here without a
    # `:?`, and deliberately so: with it unset the server never calls out, and story linking
    # falls back to matching spellings the way it did before the analyser existed. Comment
    # it out to turn the tagger off without redeploying anything else.
    ANALYSER_URL: ${ANALYSER_URL:-http://analyser:8000}

    # Only the server enforces these — assertMailConfigured runs in index.ts, not in migrate
    # or seed — but the stack is not deployable without them, so they fail here too.
    MAILGUN_API_KEY: ${MAILGUN_API_KEY:?set MAILGUN_API_KEY}
    MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:?set MAILGUN_DOMAIN}
    # US region unless overridden. An EU domain needs https://api.eu.mailgun.net here.
    MAILGUN_API_BASE: ${MAILGUN_API_BASE:-https://api.mailgun.net}
    MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@lemmata.fyi}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Lemmata}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-georgian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-georgian_dict}
      # The lexicon is Georgian and the definitions are English; sorting has to be
      # predictable across machines, so the collation is pinned rather than inherited.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # No published port, deliberately. Reach it with
    #   docker compose -f docker-compose.prod.yml exec db psql -U georgian georgian_dict
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-georgian} -d ${POSTGRES_DB:-georgian_dict}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # First boot has to initdb before it can answer, and that is slower than the interval.
      start_period: 30s

  # Applies pending migrations and exits. A separate container rather than something the
  # server does at boot, for the reason migrate.ts gives: a failed migration should stop the
  # deploy, not leave a server up and serving against a half-changed schema.
  migrate:
    <<: *server
    restart: "no"
    command: ["node", "--import", "tsx", "apps/server/src/db/migrate.ts"]

  server:
    <<: *server
    restart: unless-stopped
    # Published nowhere. web reaches it over the compose network by name.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health runs `select 1`, so this is a check on the pair and not just the process.
      # node's global fetch, because the image has no curl and adding one for this is silly.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Loads data/ into Postgres. Not part of `up` — it is a full replace of every content
  # table in one transaction, which is right after `npm run build:data` and wasted work on
  # a deploy that only changed a component.
  #
  #   docker compose -f docker-compose.prod.yml run --rm seed
  #
  # instead — same image, same data/, and the environment is already set:
  #
  #   Containers -> lemmata-server-1 -> Console -> /bin/sh, then
  #   node --import tsx apps/server/src/db/seed.ts
  #
  # It runs in a transaction and writes the content version last, so the app carries on
  # serving the old snapshot until the new one is complete.
  seed:
    <<: *server
    profiles: ["manual"]
    restart: "no"
    command: ["node", "--import", "tsx", "apps/server/src/db/seed.ts"]

  # Proves the database still matches data/. Same idea:
  #   docker compose -f docker-compose.prod.yml run --rm verify
  verify:
    <<: *server
    profiles: ["manual"]
    restart: "no"
    command: ["node", "--import", "tsx", "apps/server/src/db/verify.ts"]

  # The Georgian tagger. Asked one question — what part of speech is this word, here — when
  # an admin links a story, and otherwise idle.
  #
  # Nothing depends on it. The server treats it as optional at every call site, so this can
  # be down, restarting or never deployed at all and the only difference is that ambiguous
  # spellings go back to being decided by the order of the words table. That is why `server`
  # has no depends_on for it: waiting on a gigabyte of models to load before the site can
  # serve a page would be trading a real outage for an imaginary one.
  analyser:
    build:
      context: .
      dockerfile: apps/analyser/Dockerfile
    image: ${REGISTRY:?set REGISTRY, e.g. youruser/yourrepo}:analyser-${TAG:-20260805}
    restart: unless-stopped
    logging: *logging
    # No published port. Only `server` talks to it, over the compose network, by name.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      # /health warms every language, so a cold container reads ~400 MB off disk before it
      # answers. Two languages, twice the wait.
      start_period: 180s
    deploy:
      resources:
        limits:
          # Measured at 580 MB resident with the Georgian models loaded and a 975-token
          # story just tagged; Russian warmed alongside it roughly doubles that. The ceiling
          # is well clear of both, and it is here so that a leak in a service nothing
          # depends on cannot take Postgres down with it.
          memory: 3G

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Leave this alone for the single-origin deployment. See the note at the bottom.
      # args:
      #   VITE_API_URL: https://api.lemmata.fyi
    image: ${REGISTRY:?set REGISTRY, e.g. youruser/yourrepo}:web-${TAG:-20260805}
    restart: unless-stopped
    logging: *logging
    ports:
      # Loopback only: the proxy on this host is the one thing that should reach it, and a
      # plain-HTTP port on a public interface is one firewall rule away from serving the
      # site without TLS. Drop the 127.0.0.1: prefix only if your proxy is on another box.
      - "127.0.0.1:${WEB_PORT:-5050}:80"
    depends_on:
      # Started, not healthy: nginx should come up and serve pages even while the server is
      # still connecting to Postgres. Requests to /rpc get a 502 until it is ready.
      server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db-data:
